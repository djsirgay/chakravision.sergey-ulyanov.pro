name: One-time Chakravision credits update

on:
  push:
    paths:
      - .github/workflows/update-credits.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run Chakravision credits update'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update selected credits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          new_work = '''<section id="work"><div class="wrap"><div class="section-head micro muted"><span>02 / Selected work</span><span>Producing + editorial</span></div><h2>Selected work.</h2><p class="project-intro">Selected credits from a 28-year career. Follow linked titles for project examples.</p><div class="works">
          <article class="work"><div class="work-mark"><img src="assets/discovery.webp" alt="Discovery" loading="lazy" decoding="async"></div><div><h3><a class="project-link" href="https://www.youtube.com/watch?v=VKjm0NHOFAE" target="_blank" rel="noopener noreferrer" aria-label="Street Outlaws — watch project video on YouTube">Street Outlaws<span class="project-arrow" aria-hidden="true">↗</span></a></h3><p>Co-Executive Producer &amp; Editor · Discovery</p><span class="video-label">YouTube · Project example</span></div></article>
          <article class="work"><div class="work-mark"><img src="assets/max.webp" alt="Max" loading="lazy" decoding="async"></div><div><h3><a class="project-link" href="https://www.youtube.com/watch?v=W00grJNOIVo" target="_blank" rel="noopener noreferrer" aria-label="Project Greenlight — watch project video on YouTube">Project Greenlight<span class="project-arrow" aria-hidden="true">↗</span></a></h3><p>Lead Editor · Max</p><span class="video-label">YouTube · Project example</span></div></article>
          <article class="work"><div class="work-mark"><img src="assets/nbc.webp" alt="NBC" loading="lazy" decoding="async"></div><div><h3><a class="project-link" href="https://www.youtube.com/watch?v=MaJEUOI3KlY" target="_blank" rel="noopener noreferrer" aria-label="The Voice — watch project video on YouTube">The Voice<span class="project-arrow" aria-hidden="true">↗</span></a></h3><p>Editor · NBC · 2× Editing nominations</p><span class="video-label">YouTube · Project example</span><a class="credit-award" href="https://www.televisionacademy.com/bios/charles-kramer" target="_blank" rel="noopener noreferrer"><span>Editing nominations · The Voice</span><small>Charles Kramer · 2018 / 2021 ↗</small></a></div></article>
          <article class="work"><div class="work-mark"><img src="assets/primevideo.webp" alt="Amazon" loading="lazy" decoding="async"></div><div><h3><a class="project-link" href="https://www.youtube.com/watch?v=C9Qfcjf7L-I" target="_blank" rel="noopener noreferrer" aria-label="Beast Games — watch project video on YouTube">Beast Games<span class="project-arrow" aria-hidden="true">↗</span></a></h3><p>Editor · Amazon</p><span class="video-label">YouTube · Project example</span></div></article>
          <article class="work"><div class="work-mark"><img src="assets/netflix.webp" alt="Netflix" loading="lazy" decoding="async"></div><div><h3>Rhythm N' Flow</h3><p>Editor · Netflix</p></div></article>
          <article class="work"><div class="work-mark"><img src="assets/globalcitizen.webp" alt="Global Citizen" loading="lazy" decoding="async"></div><div><h3><a class="project-link" href="https://www.youtube.com/watch?v=DYvrG_X5l8k" target="_blank" rel="noopener noreferrer" aria-label="Global Citizen Live — watch project video on YouTube">Global Citizen Live<span class="project-arrow" aria-hidden="true">↗</span></a></h3><p>Editor · CBS</p><span class="video-label">YouTube · Project example</span></div></article>
          </div>
          <div class="work-subhead"><div class="section-head micro muted"><span>03 / Television</span><span>Selected credits</span></div><h2>More landmark television.</h2></div><div class="works">
          <article class="work"><div class="work-mark"><img src="assets/battlebots.webp" alt="BattleBots" loading="lazy" decoding="async"></div><div><h3><a class="project-link" href="https://www.youtube.com/watch?v=aIvljqOaQJ0" target="_blank" rel="noopener noreferrer" aria-label="BattleBots — watch project video on YouTube">BattleBots<span class="project-arrow" aria-hidden="true">↗</span></a></h3><p>Co-Executive Producer &amp; Editor · YouTube</p><span class="video-label">YouTube · Project example</span></div></article>
          <article class="work"><div class="work-mark"><img src="assets/abc.webp" alt="ABC" loading="lazy" decoding="async"></div><div><h3><a class="project-link" href="https://www.youtube.com/watch?v=pbSCWgZQf_g" target="_blank" rel="noopener noreferrer" aria-label="Dancing with the Stars — watch project video on YouTube">Dancing with the Stars<span class="project-arrow" aria-hidden="true">↗</span></a></h3><p>Editor · ABC</p><span class="video-label">YouTube · Project example</span></div></article>
          <article class="work"><div class="work-mark"><img src="assets/mtv.webp" alt="MTV" loading="lazy" decoding="async"></div><div><h3><a class="project-link" href="https://www.youtube.com/watch?v=5kjOg9jmScU" target="_blank" rel="noopener noreferrer" aria-label="The Osbournes — watch project video on YouTube">The Osbournes<span class="project-arrow" aria-hidden="true">↗</span></a></h3><p>Producer &amp; Editor · MTV · 1× series Emmy win</p><span class="video-label">YouTube · Project example</span><a class="credit-award" href="https://www.televisionacademy.com/shows/osbournes" target="_blank" rel="noopener noreferrer"><span>Series Emmy · Reality program</span><small>The Osbournes · 2002 ↗</small></a></div></article>
          <article class="work"><div class="work-mark"><img src="assets/bravo.webp" alt="Bravo" loading="lazy" decoding="async"></div><div><h3><a class="project-link" href="https://www.youtube.com/watch?v=5LOdvvcwCew" target="_blank" rel="noopener noreferrer" aria-label="Top Chef — watch project video on YouTube">Top Chef<span class="project-arrow" aria-hidden="true">↗</span></a></h3><p>Editor · Bravo</p><span class="video-label">YouTube · Project example</span></div></article>
          <article class="work"><div class="work-mark"><span class="text-network">THE CW</span></div><div><h3>America’s Next Top Model</h3><p>Producer &amp; Editor · The CW</p></div></article>
          <article class="work"><div class="work-mark"><img src="assets/abc.webp" alt="ABC" loading="lazy" decoding="async"></div><div><h3>Family Feud</h3><p>Editor · ABC</p></div></article>
          <article class="work"><div class="work-mark"><span class="text-network">CBS</span></div><div><h3>Big Brother</h3><p>Editor · CBS</p></div></article>
          <article class="work"><div class="work-mark"><img src="assets/netflix.webp" alt="Netflix" loading="lazy" decoding="async"></div><div><h3>SAG Awards 2025</h3><p>Consultant · Netflix</p></div></article>
          </div></div></section>'''

          work_pattern = re.compile(
              r'<section id="work">.*?</section>\s*<section class="formats" id="formats">',
              re.S,
          )
          if not work_pattern.search(html):
              raise SystemExit('Could not locate the work section')
          html = work_pattern.sub(new_work + '\n<section class="formats" id="formats">', html, count=1)

          new_formats = '''<section class="formats" id="formats"><div class="wrap"><div class="section-head micro muted"><span>04 / Range of work</span><span>Producing + editorial</span></div><h2>Across formats.</h2><div class="format-grid">
          <article class="format"><span class="format-number micro">01</span><h3>Corporate work</h3><p>Producing &amp; editorial</p></article>
          <article class="format"><span class="format-number micro">02</span><h3>Political advertising</h3><p>Producing &amp; editorial</p></article>
          <article class="format"><span class="format-number micro">03</span><h3>Documentaries</h3><div class="format-credit"><img src="assets/nbc.webp" alt="NBC" loading="lazy" decoding="async"><div><h4>LA Fire &amp; Rescue</h4><p>Editor · NBCUniversal</p></div></div><div class="format-credit"><span class="text-network">DOC</span><div><h4>American Soldier: 250 Years</h4><p>Lead Editor · Documentary · Syndication</p></div></div></article>
          <article class="format"><span class="format-number micro">04</span><h3>Scripted &amp; film</h3><div class="format-credit"><span class="text-network">FILM</span><div><h4>Lost Highway</h4><p>Editor · International trailer · David Lynch (director)</p></div></div><div class="format-credit"><img src="assets/miramax.webp" alt="Miramax" loading="lazy" decoding="async"><div><h4>Swingers</h4><p>Editor · International trailer · Miramax · Doug Liman (director)</p></div></div></article>
          </div></div></section>'''

          formats_pattern = re.compile(
              r'<section class="formats" id="formats">.*?</section>\s*<section class="red atmosphere" id="studio">',
              re.S,
          )
          if not formats_pattern.search(html):
              raise SystemExit('Could not locate the formats section')
          html = formats_pattern.sub(new_formats + '\n<section class="red atmosphere" id="studio">', html, count=1)

          old_about = 'Producer and editor in unscripted television, documentary and film. Based at Chakravision Productions Inc., his studio in Culver City.'
          new_about = 'Award-winning producer and editor with 28 years shaping network, streaming, documentary, competition and music-related content. Based at Chakravision Productions Inc., his studio in Culver City.'
          if old_about not in html:
              raise SystemExit('Could not locate the about paragraph')
          html = html.replace(old_about, new_about, 1)

          css = '''\n.text-network{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:7px;border:1px solid var(--line);font:700 12px/1.1 Menlo,Consolas,monospace;letter-spacing:.045em;text-align:center;color:var(--ink)}\n.format-credit>.text-network{width:85px;border-color:#c9c6c1}.work-mark>.text-network{min-height:58px}\n'''
          if '.text-network{' not in html:
              html = html.replace('</style>', css + '</style>', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/update-credits.yml

      - name: Commit site update
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/update-credits.yml
          git commit -m "Update Charles Kramer selected credits"
          git push
